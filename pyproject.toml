[project]
name = "road-to-agent-memory"
version = "0.1.0"
description = "Road to Agent Memory — Neo4j Agent Memory workshop (Acme Cloud SupportBot)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j-agent-memory[pydantic-ai,openai]==0.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[neo4j]>=4.8.0",
    "ruff>=0.8.0",
    "playwright>=1.48.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Seed-data files are content-heavy; long data lines are intentional there.
"scripts/seed_sqlite.py" = ["E501"]
"scripts/seed_nams.py" = ["E501"]
# Long question strings in the eval set are content, not code.
"scripts/eval.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "behavioral: live module-agent and graph-invariant tests (RUN_BEHAVIORAL=1)",
]
