name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-verification catches OpenAI or memory-library changes through
    # the live agent rehearsal.
    - cron: "0 7 * * 1"

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest tests/ -m "not behavioral" -x -q
      - run: uv lock --check
      - run: npm --prefix web ci && npm --prefix web run build
      - run: uv run playwright install --with-deps chromium
      - run: RUN_UI=1 uv run pytest tests/test_ui.py -q

  behavioral:
    # Live lesson agents and graph invariants against
    # ephemeral Neo4j. Runs weekly + on manual dispatch (spends LLM tokens).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: docker run -d --name neo4j -p 7687:7687 -e NEO4J_AUTH=neo4j/testpassword neo4j:5.26
      - run: sleep 20
      - env:
          RUN_BEHAVIORAL: "1"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword
        run: uv run pytest tests/test_behavioral.py -q
