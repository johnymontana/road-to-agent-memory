<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 720 405" role="img"><title>Conversation memory survives restarts</title><desc>One conversation has four HAS_MESSAGE edges, one to each message. Three NEXT_MESSAGE edges link consecutive messages. History retrieval selects all conversation members, orders by timestamp and id, and supplies the latest turns in chronological order.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0a6190"/></marker></defs><rect width="720" height="405" fill="#faf8f5"/><rect width="5" height="405" fill="#4e9ca6"/><text x="29" y="24" font-family="Public Sans, sans-serif" font-size="10" font-weight="700" fill="#0a6190">Module 2</text><text x="29" y="62" font-family="Syne, sans-serif" font-size="26" fill="#004063">Conversation memory survives restarts</text><line x1="400.56" y1="151.06" x2="596.89" y2="233.65" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="387.08" y1="168.68" x2="426.23" y2="218.84" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="332.19" y1="168.09" x2="290.39" y2="219.33" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="360.0" cy="134.0" r="42.0" fill="#4e9ca6" stroke="#004063" stroke-width="1.2"/><rect x="406" y="99" width="115" height="22" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="463.5" y="113.57" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="400" fill="#0a6190">session_id</text><circle cx="85.0" cy="248.0" r="34.0" fill="#8dcc55" stroke="#004063" stroke-width="1.2"/><circle cx="267.0" cy="248.0" r="34.0" fill="#8dcc55" stroke="#004063" stroke-width="1.2"/><circle cx="449.0" cy="248.0" r="34.0" fill="#8dcc55" stroke="#004063" stroke-width="1.2"/><circle cx="631.0" cy="248.0" r="34.0" fill="#8dcc55" stroke="#004063" stroke-width="1.2"/><line x1="319.35" y1="150.85" x2="119.18" y2="2