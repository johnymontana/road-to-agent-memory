<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 720 405" role="img"><title>Three memory types, one knowledge graph</title><desc>Conversation has Message. Message mentions Entity. A ReasoningTrace is initiated by that Message. The client exposes short-term, long-term and reasoning memory.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0a6190"/></marker></defs><rect width="720" height="405" fill="#faf8f5"/><rect width="5" height="405" fill="#4e9ca6"/><text x="29" y="24" font-family="Public Sans, sans-serif" font-size="10" font-weight="700" fill="#0a6190">Introduction</text><text x="29" y="62" font-family="Syne, sans-serif" font-size="26" fill="#004063">Three memory types, one knowledge graph</text><circle cx="130.0" cy="173.0" r="43.0" fill="#8dcc55" stroke="#004063" stroke-width="1.2"/><rect x="69" y="221" width="122" height="22" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="130.0" y="235.57" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="400" fill="#0a6190">session_id</text><circle cx="310.0" cy="173.0" r="39.0" fill="#8dcc55" stroke="#004063" stroke-width="1.2"/><rect x="314.467" y="209.935" width="114" height="22" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="371.467" y="224.505" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="400" fill="#0a6190">role · content</text><circle cx="500.0" cy="173.0" r="40.0" fill="#ffce47" stroke="#004063" stroke-width="1.2"/><rect x="442" y="218" width="116" height="22" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="500.0" y="232.57" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="400" fill="#0a6190">type · aliases</text><circle cx="310.0" cy="283.0" r="40.0" fill="#657eff" stroke="#004063" stroke-width="1.2"/><line x1="175.0" y1="173.0" x2="268.0" y2="173.0"