<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380"><rect x="0" y="0" width="960" height="380" fill="#ffffff" rx="12"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#495057"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#C92A2A"/></marker></defs><text x="480" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1e1e1e" font-weight="700">Module 1's failure: no bridge between sessions</text><rect x="90" y="100" width="300" height="180" rx="10" fill="#B2F2BB" stroke="#2F9E44" stroke-width="2.5"/><text x="240.0" y="168.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">Session A</text><text x="240.0" y="192.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">“double-charged $49”</text><text x="240.0" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#495057">agent learns: name, plan, charge</text><rect x="570" y="100" width="300" height="180" rx="10" fill="#B2F2BB" stroke="#2F9E44" stroke-width="2.5"/><text x="720.0" y="168.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">Session B</text><text x="720.0" y="192.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">“it's me again…”</text><text x="720.0" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#495057">agent asks: who are you?</text><line x1="390" y1="190" x2="570" y2="190" stroke="#C92A2A" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr-red)"/><line x1="440" y1="150" x2="520" y2="230" stroke="#C92A2A" stroke-width="3.5"/><text x="480" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#495057">the process exits → everything the agent learned is gone</text></svg>