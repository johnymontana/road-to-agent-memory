<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 720 405" role="img"><title>Stateless turns have no bridge</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0a6190"/></marker></defs><rect width="720" height="405" fill="#faf8f5"/><rect width="5" height="405" fill="#4e9ca6"/><text x="29" y="24" font-family="Public Sans, sans-serif" font-size="10" font-weight="700" fill="#0a6190">Module 1</text><text x="29" y="62" font-family="Syne, sans-serif" font-size="26" fill="#004063">Stateless turns have no bridge</text><rect x="29" y="121" width="272" height="158" rx="12" fill="#edf4f5" stroke="#0a6190" stroke-width="0.9"/><rect x="37" y="130" width="256" height="25" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="165.0" y="147.26" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="14" font-weight="700" fill="#123c50">Turn 1 · self-contained</text><rect x="38" y="157" width="254" height="116" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="165.0" y="212.60000000000002" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">Account email is supplied.</text><text x="165.0" y="225.56000000000003" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">Business tools can answer.</text><rect x="419" y="121" width="272" height="158" rx="12" fill="#edf4f5" stroke="#0a6190" stroke-width="0.9"/><rect x="427" y="130" width="256" height="25" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="555.0" y="147.26" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="14" font-weight="700" fill="#123c50">Turn 2 · forgetting control</text><rect x="428" y="157" width="254" height="116" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="555.0" y="212.60000000000002" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">“What email did I give you?”</text><text x="555.0" y="225.56000000000003" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">No message_history is supplied.</text><line x1="303" y1="199" x2="417" y2="199" stroke="#ff8a65" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/><rect x="305" y="142" width="110" height="45" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="360.0" y="162.10000000000002" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#0a6190">NO PRIOR</text><text x="360.0" y="175.06000000000003" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#0a6190">CONTEXT</text><rect x="29" y="292" width="662" height="41" rx="12" fill="#edf4f5" stroke="#4e9ca6" stroke-width="0.7"/><rect x="29" y="292" width="3" height="41" rx="0" fill="#4e9ca6" stroke="none" stroke-width="1"/><rect x="40" y="300" width="640" height="21" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="47.2" y="314.41" text-anchor="start" font-family="Public Sans, sans-serif" font-size="11.5" font-weight="700" fill="#0a6190">VISIBLE CHAT ≠ MODEL CONTEXT</text><rect x="29" y="345" width="662" height="34" rx="12" fill="#004063" stroke="none" stroke-width="1"/><rect x="40" y="345" width="640" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="47.2" y="366.08" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#ffffff">Every Agent.run is stateless unless the application supplies history or retrieved evidence.</text><circle cx="614.5" cy="393.5" r="2.5" fill="#4e9ca6" stroke="none" stroke-width="1"/><circle cx="627.5" cy="393.5" r="2.5" fill="#4e9ca6" stroke="none" stroke-width="1"/><circle cx="640.5" cy="393.5" r="2.5" fill="#a7bbc3" stroke="none" stroke-width="1"/><circle cx="653.5" cy="393.5" r="2.5" fill="#a7bbc3" stroke="none" stroke-width="1"/><circle cx="666.5" cy="393.5" r="2.5" fill="#a7bbc3" stroke="none" stroke-width="1"/><circle cx="679.5" cy="393.5" r="2.5" fill="#a7bbc3" stroke="none" stroke-width="1"/></svg>
