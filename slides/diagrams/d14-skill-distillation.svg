<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 720 405" role="img"><title>Inspect the versioned skill graph</title><desc>Skill has a SkillVersion. A new version supersedes the previous version. Each SkillVersion has SkillSteps. A SkillStep can be grounded in entity, execution-step, or tool-call evidence. The package lists claim evidence separately in provenance.json.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0a6190"/></marker></defs><rect width="720" height="405" fill="#faf8f5"/><rect width="5" height="405" fill="#4e9ca6"/><text x="29" y="24" font-family="Public Sans, sans-serif" font-size="10" font-weight="700" fill="#0a6190">Module 5</text><text x="29" y="62" font-family="Syne, sans-serif" font-size="26" fill="#004063">Inspect the versioned skill graph</text><line x1="115" y1="177" x2="207" y2="177" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="115" y="147" width="96" height="20" rx="0" fill="#faf8f5" stroke="none" stroke-width="1"/><text x="163.0" y="160.57" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="700" fill="#0a6190">HAS_VERSION</text><line x1="288" y1="177" x2="378" y2="177" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="287" y="147" width="94" height="20" rx="0" fill="#faf8f5" stroke="none" stroke-width="1"/><text x="334.0" y="160.57" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="700" fill="#0a6190">HAS_STEP</text><line x1="248" y1="217" x2="248" y2="259" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="262" y="226" width="104" height="20" rx="0" fill="#faf8f5" stroke="none" stroke-width="1"/><text x="314.0" y="239.57" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="700" fill="#0a6190">SUPERSEDES</text><line x1="454" y1="164" x2="602" y2="136"