ont-weight="700" fill="#123c50">ToolCall</text><rect x="31" y="241" width="176" height="91" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="38.2" y="271.14" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#0a6190">Same skillId</text><text x="38.2" y="284.09999999999997" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#0a6190">New versionId</text><text x="38.2" y="297.06" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#0a6190">Claims in</text><text x="38.2" y="310.02" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#0a6190">provenance.json</text><rect x="29" y="345" width="662" height="34" rx="12" fill="#004063" stroke="none" stroke-width="1"/><rect x="40" y="345" width="640" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="47.2" y="366.08" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#ffffff">A skill has versions. A version has steps. Each grounded step links to its source evidence.</text><circle cx="614.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="627.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="640.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="653.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="666.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="679.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/></svg>
