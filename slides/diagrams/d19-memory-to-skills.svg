<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 720 405" role="img"><title>Build reusable procedures on agent memory</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0a6190"/></marker></defs><rect width="720" height="405" fill="#faf8f5"/><rect width="5" height="405" fill="#4e9ca6"/><text x="29" y="24" font-family="Public Sans, sans-serif" font-size="10" font-weight="700" fill="#0a6190">Module 5</text><text x="29" y="62" font-family="Syne, sans-serif" font-size="26" fill="#004063">Build reusable procedures on agent memory</text><line x1="285" y1="192" x2="120" y2="231" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="75" y1="192" x2="70" y2="231" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="29" y="94" width="320" height="22" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="36.2" y="108.91" text-anchor="start" font-family="Public Sans, sans-serif" font-size="11.5" font-weight="700" fill="#0a6190">AGENT MEMORY · persisted evidence</text><circle cx="75.0" cy="157.0" r="33.0" fill="#8dcc55" stroke="#004063" stroke-width="0.9"/><rect x="32" y="124" width="86" height="66" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="75.0" y="154.60000000000002" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">Conver-</text><text x="75.0" y="167.56000000000003" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">sation</text><circle cx="180.0" cy="157.0" r="33.0" fill="#ffce47" stroke="#004063" stroke-width="0.9"/><rect x="137" y="124" width="86" height="66" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="180.0" y="161.08" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">Entity</text><circle cx="285.0" cy="157.0" r="33.0" fill="#657eff" stroke="#004063" stroke-width="0.9"/><rect x="242" y="124" width="86" height="66" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="285.0" y="161.08" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">Trace</text><rect x="362" y="101" width="329" height="102" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="369.2" y="121.32000000000001" text-anchor="start" font-family="Public Sans, sans-serif" font-size="13" font-weight="400" fill="#123c50">Distillation abstracts a repeatable</text><text x="369.2" y="135.36" text-anchor="start" font-family="Public Sans, sans-serif" font-size="13" font-weight="400" fill="#123c50">procedure from selected observations and</text><text x="369.2" y="149.4" text-anchor="start" font-family="Public Sans, sans-serif" font-size="13" font-weight="400" fill="#123c50">executions.</text><text x="369.2" y="163.44" text-anchor="start" font-family="Public Sans, sans-serif" font-size="13" font-weight="400" fill="#123c50"></text><text x="369.2" y="177.48000000000002" text-anchor="start" font-family="Public Sans, sans-serif" font-size="13" font-weight="400" fill="#123c50">Keep the evidence; publish a reusable</text><text x="369.2" y="191.52" text-anchor="start" font-family="Public Sans, sans-serif" font-size="13" font-weight="400" fill="#123c50">skill.</text><line x1="180" y1="192" x2="96" y2="231" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="29" y="236" width="134" height="95" rx="12" fill="#edf4f5" stroke="#0a6190" stroke-width="0.9"/><rect x="33" y="239" width="126" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="96.0" y="260.08" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#0a6190">SELECT SCOPE</text><rect x="33" y="273" width="126" height="53" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="96.0" y="290.62" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">Conversation or</text><text x="96.0" y="303.58" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">workspace</text><text x="96.0" y="316.54" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">evidence</text><rect x="205" y="236" width="134" height="95" rx="12" fill="#dad9ff" stroke="#0a6190" stroke-width="0.9"/><rect x="209" y="239" width="126" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="272.0" y="260.08" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#0a6190">DISTILL</text><rect x="209" y="273" width="126" height="53" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="272.0" y="290.62" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">Observed</text><text x="272.0" y="303.58" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">patterns</text><text x="272.0" y="316.54" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">→ procedure</text><rect x="381" y="236" width="134" height="95" rx="12" fill="#dad9ff" stroke="#0a6190" stroke-width="0.9"/><rect x="385" y="239" width="126" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="448.0" y="260.08" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#0a6190">REVIEW + PACKAGE</text><rect x="385" y="273" width="126" height="53" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="448.0" y="290.62" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">Versioned</text><text x="448.0" y="303.58" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">SKILL.md</text><text x="448.0" y="316.54" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">+ provenance</text><rect x="557" y="236" width="134" height="95" rx="12" fill="#8dcc55" stroke="#0a6190" stroke-width="0.9"/><rect x="561" y="239" width="126" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="624.0" y="260.08" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#0a6190">CONSUME</text><rect x="561" y="273" width="126" height="53" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="624.0" y="290.62" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">Fresh agent</text><text x="624.0" y="303.58" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">+ current SQL</text><text x="624.0" y="316.54" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">tools</text><line x1="163" y1="283" x2="202" y2="283" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="339" y1="283" x2="378" y2="283" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="515" y1="283" x2="554" y2="283" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="29" y="345" width="662" height="34" rx="12" fill="#004063" stroke="none" stroke-width="1"/><rect x="40" y="345" width="640" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="47.2" y="359.59999999999997" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#ffffff">Built on memory, not a fourth memory store. The artifact changes agent instructions, not</text><text x="47.2" y="372.55999999999995" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#ffffff">model weights.</text><circle cx="614.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="627.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="640.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="653.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="666.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="679.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/></svg>
