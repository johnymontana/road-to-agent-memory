<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 720 405" role="img"><title>Govern the evidence behind a skill</title><desc>Check the starting SQL limit and record the before and after values. Hosted drift is measured separately by status, staleClaims and staleSteps after an instructor deletes cited hosted evidence. Inspect the new version and its source IDs. Restore SQL to 250 dollars only when needed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0a6190"/></marker></defs><rect width="720" height="405" fill="#faf8f5"/><rect width="5" height="405" fill="#4e9ca6"/><text x="29" y="24" font-family="Public Sans, sans-serif" font-size="10" font-weight="700" fill="#0a6190">Module 5</text><text x="29" y="62" font-family="Syne, sans-serif" font-size="26" fill="#004063">Govern the evidence behind a skill</text><rect x="29" y="103" width="662" height="29" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="36.2" y="114.9" text-anchor="start" font-family="Public Sans, sans-serif" font-size="13" font-weight="700" fill="#0a6190">Instructor uses a disposable workspace. Inspect the skill ID and cited entity IDs</text><text x="36.2" y="128.94" text-anchor="start" font-family="Public Sans, sans-serif" font-size="13" font-weight="700" fill="#0a6190">first.</text><rect x="29" y="150" width="151" height="174" rx="12" fill="#ffce47" stroke="#0a6190" stroke-width="0.9"/><rect x="35" y="159" width="139" height="31" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="104.5" y="178.58" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#0a6190">1 · SQL POLICY</text><rect x="36" y="195" width="137" height="115" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="104.5" y="236.5" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">Read Pro limit</text><text x="104.5" y="250.0" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">Toggle SQLite</text><text x="104.5" y="263.5" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">Read before →</text><text x="104.5" y="277.0" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">after</text><rect x="199" y="150" width="151" height="174" rx="12" fill="#edf4f5" stroke="#0a6190" stroke-width="0.9"/><rect x="205" y="159" width="139" height="31" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="274.5" y="178.58" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#0a6190">2 · HOSTED DRIFT</text><rect x="206" y="195" width="137" height="115" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="274.5" y="229.75" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">Delete cited</text><text x="274.5" y="243.25" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">entities</text><text x="274.5" y="256.75" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">Read status,</text><text x="274.5" y="270.25" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">staleClaims and</text><text x="274.5" y="283.75" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">staleSteps</text><rect x="369" y="150" width="151" height="174" rx="12" fill="#dad9ff" stroke="#0a6190" stroke-width="0.9"/><rect x="375" y="159" width="139" height="31" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="444.5" y="178.58" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#0a6190">3 · NEW VERSION</text><rect x="376" y="195" width="137" height="115" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="444.5" y="236.5" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">Same skillId</text><text x="444.5" y="250.0" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">New versionId</text><text x="444.5" y="263.5" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">Diff text and</text><text x="444.5" y="277.0" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">source IDs</text><rect x="539" y="150" width="151" height="174" rx="12" fill="#8dcc55" stroke="#0a6190" stroke-width="0.9"/><rect x="545" y="159" width="139" height="31" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="614.5" y="178.58" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#0a6190">4 · RESTORE</text><rect x="546" y="195" width="137" height="115" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="614.5" y="236.5" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">Read SQL limit</text><text x="614.5" y="250.0" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">At $150, toggle</text><text x="614.5" y="263.5" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">once</text><text x="614.5" y="277.0" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12.5" font-weight="400" fill="#123c50">At $250, stop</text><line x1="180" y1="236" x2="196" y2="236" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="350" y1="236" x2="366" y2="236" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="520" y1="236" x2="536" y2="236" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="29" y="345" width="662" height="34" rx="12" fill="#004063" stroke="none" stroke-width="1"/><rect x="40" y="345" width="640" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="47.2" y="366.08" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#ffffff">The $49 ticket fits both limits. A case between $150 and $250 would test the policy change.</text><circle cx="614.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="627.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="640.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="653.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="666.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/><circle cx="679.5" cy="393.5" r="2.5" fill="#dad9ff" stroke="none" stroke-width="1"/></svg>
