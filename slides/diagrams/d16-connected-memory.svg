<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 720 405" role="img"><title>Memory is the foundation; skills build on it</title><desc>In the participant Bolt graph, a conversation has a message. The message mentions an entity. A trace is initiated by the message, has a step, and that step touches the selected case entity. In the hosted workspace, a skill version has a step grounded in source evidence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0a6190"/></marker></defs><rect width="720" height="405" fill="#faf8f5"/><rect width="5" height="405" fill="#4e9ca6"/><text x="29" y="24" font-family="Public Sans, sans-serif" font-size="10" font-weight="700" fill="#0a6190">Wrap</text><text x="29" y="62" font-family="Syne, sans-serif" font-size="26" fill="#004063">Memory is the foundation; skills build on it</text><rect x="29" y="107" width="418" height="226" rx="12" fill="#edf4f5" stroke="#4e9ca6" stroke-width="1"/><rect x="468" y="107" width="223" height="226" rx="12" fill="#edf4f5" stroke="#657eff" stroke-width="1"/><rect x="43" y="111" width="390" height="23" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="50.2" y="126.41" text-anchor="start" font-family="Public Sans, sans-serif" font-size="11.5" font-weight="700" fill="#0a6190">PARTICIPANT BOLT GRAPH</text><rect x="480" y="111" width="197" height="23" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="487.2" y="126.07" text-anchor="start" font-family="Public Sans, sans-serif" font-size="10.5" font-weight="700" fill="#0a6190">HOSTED · DERIVED SKILLS</text><circle cx="83.0" cy="185.0" r="31.0" fill="#4e9ca6" stroke="#004063" stroke-width="1.2"/><circle cx="219.0" cy="185.0" r="31.0" fill="#8dcc55" stroke="#004063" stroke-width="1.2"/><circle cx="363.0" cy="285.0" r="31.0" fill="#ffce47" stroke="#004063" stroke-width="1.2"/><circle cx="83.0" cy="285.0" r="31.0" fill="#657eff" stroke="#00406