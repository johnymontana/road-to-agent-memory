<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><rect x="0" y="0" width="960" height="400" fill="#ffffff" rx="12"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#495057"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#C92A2A"/></marker></defs><text x="480" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1e1e1e" font-weight="700">A familiar ticket recalls a recorded solution</text><rect x="50" y="150" width="210" height="90" rx="10" fill="#F1F3F5" stroke="#495057" stroke-width="2.5"/><text x="155.0" y="183.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">new ticket</text><text x="155.0" y="207.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">“double-billed $129”</text><rect x="330" y="60" width="280" height="90" rx="10" fill="#D0BFFF" stroke="#9C36B5" stroke-width="2.5"/><text x="470.0" y="83.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">yesterday's trace</text><text x="470.0" y="107.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">(same shape)</text><text x="470.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#495057">task → steps → outcome: success</text><rect x="330" y="250" width="280" height="90" rx="10" fill="#D0BFFF" stroke="#9C36B5" stroke-width="2.5"/><text x="470.0" y="273.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">yesterday's failed trace</text><text x="470.0" y="297.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">($400, over limit)</text><text x="470.0" y="326" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#495057">task → steps → outcome: rejected</text><rect x="700" y="150" width="220" height="90" rx="10" fill="#E5DBFF" stroke="#6366F1" stroke-width="2.5"/><text x="810.0" y="185.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e1e1e">primed agent</text><text x="810.0" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#495057">procedure from memory</text><line x1="260" y1="175" x2="330" y2="105" stroke="#495057" stroke-width="2.5" marker-end="url(#arr)"/><text x="295.0" y="132.0" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#495057">similar-task retrieval</text><line x1="260" y1="215" x2="330" y2="295" stroke="#495057" stroke-width="2.5" marker-end="url(#arr)"/><line x1="610" y1="195" x2="700" y2="195" stroke="#495057" stroke-width="2.5" marker-end="url(#arr)"/><text x="480" y="375" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#495057">Equal private SQL, separate messages, frozen corpus. Measure the result.</text></svg>