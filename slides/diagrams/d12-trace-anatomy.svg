<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 720 405" role="img"><title>Anatomy of a trace</title><desc>A reasoning trace has a reasoning step. The step uses a tool call, which is an instance of a tool. A message initiated the trace. TOUCHED connects a step to the selected case customer and plan. The arguments, result and recorded SQL describe the operation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0a6190"/></marker></defs><rect width="720" height="405" fill="#faf8f5"/><rect width="5" height="405" fill="#4e9ca6"/><text x="29" y="24" font-family="Public Sans, sans-serif" font-size="10" font-weight="700" fill="#0a6190">Module 4</text><text x="29" y="62" font-family="Syne, sans-serif" font-size="26" fill="#004063">Anatomy of a trace</text><circle cx="90.0" cy="163.0" r="40.0" fill="#657eff" stroke="#004063" stroke-width="1.2"/><circle cx="270.0" cy="163.0" r="40.0" fill="#657eff" stroke="#004063" stroke-width="1.2"/><circle cx="450.0" cy="163.0" r="37.0" fill="#657eff" stroke="#004063" stroke-width="1.2"/><circle cx="630.0" cy="163.0" r="34.0" fill="#dad9ff" stroke="#004063" stroke-width="1.2"/><line x1="132.0" y1="163.0" x2="227.0" y2="163.0" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="135.0" y="107.0" width="90" height="22" rx="0" fill="#faf8f5" stroke="none" stroke-width="1"/><text x="180.0" y="121.57" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="700" fill="#0a6190">HAS_STEP</text><line x1="312.0" y1="163.0" x2="410.0" y2="163.0" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="315.0" y="107.0" width="90" height="22" rx="0" fill="#faf8f5" stroke="none" stroke-width="1"/><text x="360.0" y="121.57" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="700" fill="#0a6190">USES_TOOL</text><line x1="489.0" y1="163.0" x2="593.0" y2="163.0" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="495.0" y="107.0" width="90" height="22" rx="0" fill="#faf8f5" stroke="none" stroke-width="1"/><text x="540.0" y="121.57" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="700" fill="#0a6190">INSTANCE_OF</text><circle cx="90.0" cy="287.0" r="31.0" fill="#8dcc55" stroke="#004063" stroke-width="1.2"/><circle cx="270.0" cy="287.0" r="35.0" fill="#ffce47" stroke="#004063" stroke-width="1.2"/><line x1="90.0" y1="205.0" x2="90.0" y2="253.0" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="97" y="218" width="105" height="22" rx="0" fill="#faf8f5" stroke="none" stroke-width="1"/><text x="149.5" y="232.57" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="700" fill="#0a6190">INITIATED_BY</text><line x1="270.0" y1="205.0" x2="270.0" y2="249.0" stroke="#0a6190" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="276" y="218" width="90" height="22" rx="0" fill="#faf8f5" stroke="none" stroke-width="1"/><text x="321.0" y="232.57" text-anchor="middle" font-family="Courier New, sans-serif" font-size="10.5" font-weight="700" fill="#0a6190">TOUCHED</text><rect x="392" y="243" width="299" height="85" rx="12" fill="#edf4f5" stroke="#4e9ca6" stroke-width="0.7"/><rect x="392" y="243" width="3" height="85" rx="0" fill="#4e9ca6" stroke="none" stroke-width="1"/><rect x="403" y="251" width="277" height="21" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="410.2" y="265.41" text-anchor="start" font-family="Public Sans, sans-serif" font-size="11.5" font-weight="700" fill="#0a6190">CHECK THE OPERATION</text><rect x="403" y="271" width="277" height="53" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="410.2" y="288.62" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">The tool call carries arguments,</text><text x="410.2" y="301.58" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">result and executed SQL. The trace</text><text x="410.2" y="314.54" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#123c50">stores reply and outcome.</text><rect x="29" y="345" width="662" height="34" rx="12" fill="#004063" stroke="none" stroke-width="1"/><rect x="40" y="345" width="640" height="34" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="47.2" y="359.59999999999997" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#ffffff">Trace → step → tool call → tool. TOUCHED associates each captured step with its selected</text><text x="47.2" y="372.55999999999995" text-anchor="start" font-family="Public Sans, sans-serif" font-size="12" font-weight="400" fill="#ffffff">case.</text><circle cx="614.5" cy="393.5" r="2.5" fill="#657eff" stroke="none" stroke-width="1"/><circle cx="627.5" cy="393.5" r="2.5" fill="#657eff" stroke="none" stroke-width="1"/><circle cx="640.5" cy="393.5" r="2.5" fill="#657eff" stroke="none" stroke-width="1"/><circle cx="653.5" cy="393.5" r="2.5" fill="#657eff" stroke="none" stroke-width="1"/><circle cx="666.5" cy="393.5" r="2.5" fill="#657eff" stroke="none" stroke-width="1"/><circle cx="679.5" cy="393.5" r="2.5" fill="#a7bbc3" stroke="none" stroke-width="1"/><rect x="40" y="123" width="100" height="80" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="90.0" y="160.60000000000002" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">Reasoning</text><text x="90.0" y="173.56000000000003" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">Trace</text><rect x="220" y="123" width="100" height="80" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="270.0" y="160.60000000000002" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">Reasoning</text><text x="270.0" y="173.56000000000003" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">Step</text><rect x="403" y="126" width="94" height="74" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="450.0" y="167.08" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">ToolCall</text><rect x="586" y="129" width="88" height="68" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="630.0" y="167.08" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">Tool</text><rect x="49" y="256" width="82" height="62" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="90.0" y="291.08" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">Message</text><rect x="225" y="252" width="90" height="70" rx="0" fill="none" stroke="none" stroke-width="1"/><text x="270.0" y="284.59999999999997" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">Customer</text><text x="270.0" y="297.55999999999995" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" font-weight="700" fill="#123c50">/ Plan</text></svg>
